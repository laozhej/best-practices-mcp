version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dom-tooling-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      dom-tooling-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      action-updates:
        applies-to: version-updates
        patterns: ['*']
        update-types: [major, minor, patch]
      action-security:
        applies-to: security-updates
        patterns: ['*']
